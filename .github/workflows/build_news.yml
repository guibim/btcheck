name: Build news.json & Publish

on:
  schedule:
    - cron: "10 12 * * *"   # 09:10 BRT
    - cron: "10 22 * * *"   # 19:10 BRT
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-news:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      TZ: America/Sao_Paulo
      NEWS_LIMIT: 10
    steps:
      - uses: actions/checkout@v4

      # ── Frontend ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # ── Backend ───────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install psycopg[binary]==3.2.1 requests==2.32.3

      - name: Build news.json
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
          NEWS_LIMIT: ${{ env.NEWS_LIMIT }}
        run: python scripts/build_json.py

      # ── Montar artefato ───────────────────────────────────────────────────
      - name: Move news.json → dist
        run: mv public/news.json frontend/dist/news.json

      - name: Fetch latest btc_price.json (carry-over)
        run: |
          curl -fsSL https://guibim.github.io/btcheck/btc_price.json \
            -o frontend/dist/btc_price.json \
            || echo '{"updated_at":"","source":"coingecko","prices":{"BTC_USD":0,"BTC_BRL":0}}' \
            > frontend/dist/btc_price.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
