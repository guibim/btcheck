name: Send Weekly Newsletter

on:
  schedule:
    - cron: "0 15 * * 5"   # Sexta-feira às 15:00 UTC = 12:00 BRT
  workflow_dispatch:         # Disparo manual para testes

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEWS_LIMIT: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install psycopg[binary]==3.2.1 requests==2.32.3 resend supabase

      - name: Send newsletter
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
          RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
          NEWS_LIMIT:            ${{ env.NEWS_LIMIT }}
        run: python scripts/send_newsletter.py
