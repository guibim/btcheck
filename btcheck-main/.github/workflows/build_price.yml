name: Build BTC Price & Publish

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min (UTC)
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-price:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # ── Frontend ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # ── Backend ───────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests==2.32.3

      - name: Build BTC price (USD+BRL)
        run: python scripts/get_btc_price.py

      # ── Montar artefato ───────────────────────────────────────────────────
      - name: Move btc_price.json → dist
        run: mv public/btc_price.json frontend/dist/btc_price.json

      - name: Fetch latest news.json (carry-over)
        run: |
          curl -fsSL https://guibim.github.io/btcheck/news.json \
            -o frontend/dist/news.json \
            || echo '{"generated_at":"","count":0,"items":[]}' \
            > frontend/dist/news.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
